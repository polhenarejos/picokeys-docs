site_name: PicoKeys Documentation
site_description: Firmware-first documentation for Pico FIDO, Pico OpenPGP, and Pico HSM
site_url: https://docs.picokeys.com/
site_dir: site
exclude_docs: |
  pico-novus/**

theme:
  name: material
  language: en
  logo: assets/images/picokeys.png
  favicon: assets/images/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home:
      - Overview: index.md
      - Production hardening:
        - OTP fuses: production/otp-fuses.md
        - Anti-rollback: production/anti-rollback.md
        - Threat model: security/threat-model.md

  - Pico FIDO:
      - Overview: picofido/index.md
      - Quick start: picofido/quickstart.md
      - Setup and policy: picofido/initialization.md
      - Pico Vault: picofido/vault.md
      - Changelog:
        - Pico FIDO 8: picofido/release-notes.md
      - Using the device:
        - FIDO2 / WebAuthn / U2F: picofido/passkeys.md
        - SSH keys: picofido/ssh.md
        - Git signing + auth: picofido/git.md
        - OATH: picofido/accounts-oath.md
        - OTP: picofido/slots-otp.md
        - Vendor extensions: picofido/vendor-extensions.md
      - Limitations: picofido/limitations.md
      - Troubleshooting: picofido/troubleshooting.md

  - Pico OpenPGP:
      - Overview: pico-openpgp/index.md
      - Host setup and compatibility: pico-openpgp/compatibility-notes.md
      - PINs and roles: pico-openpgp/pin-and-roles.md
      - Using the device:
        - OpenPGP card: pico-openpgp/openpgp-card.md
        - PIV: pico-openpgp/piv.md
        - Key management: pico-openpgp/key-management.md
        - Daily use: pico-openpgp/daily-use.md
        - Recovery and reset: pico-openpgp/recovery-reset.md
      - Operational limits: pico-openpgp/operational-limits.md
      - Troubleshooting: pico-openpgp/troubleshooting.md

  - Pico HSM:
      - Overview: picohsm/index.md
      - First steps: picohsm/first-steps.md
      - Capability map: picohsm/features.md
      - Key generation: picohsm/key-generation.md
      - Sign and verify: picohsm/sign-verify.md
      - Asymmetric ciphering: picohsm/asymmetric-ciphering.md
      - AES: picohsm/aes.md
      - Backup and restore: picohsm/backup-restore.md
      - Store data: picohsm/store-data.md
      - Public key authentication: picohsm/public-key-authentication.md
      - Smart Card Shell 3: picohsm/scs3.md

  # Pico Novus is not released yet. Re-enable this tab when publishing it.
  # - Pico Novus:
  #     - Overview: pico-novus/index.md
  #     - Architecture: pico-novus/architecture.md
  #     - Getting started: pico-novus/first-steps.md
  #     - Signed sessions: pico-novus/signed-sessions.md
  #     - API map: pico-novus/api-map.md
  #     - Core model:
  #       - Concepts: pico-novus/concepts.md
  #       - Users and access: pico-novus/users-and-access.md
  #       - Domains: pico-novus/domains.md
  #       - Keys: pico-novus/keys.md
  #     - Using the API:
  #       - Crypto operations: pico-novus/crypto-operations.md
  #       - Trust and transfer: pico-novus/trust-and-transfer.md
  #       - Device management: pico-novus/device-management.md
  #     - Development:
  #       - Developer guide: pico-novus/developer-guide.md
  #       - Errors and status codes: pico-novus/errors-and-status.md
  #       - Testing: pico-novus/testing.md
  #     - Limitations: pico-novus/limitations.md
  #     - Troubleshooting: pico-novus/troubleshooting.md

  - PicoKey App:
      - Overview: picokeyapp/index.md
      - Concepts: picokeyapp/concepts.md
      - Installation: picokeyapp/install.md
      - First steps: picokeyapp/first-steps.md
      - Quick start: picokeyapp/quickstart.md
      - Troubleshooting: picokeyapp/troubleshooting.md
      - Release notes: picokeyapp/release-notes.md
      - Usage guide:
        - Home screen: picokeyapp/home.md
        - Device configuration: picokeyapp/configuration.md
        - Security boot & lock: picokeyapp/security.md
        - Firmware management: picokeyapp/firmware.md
        - FIDO:
          - Dashboard: picokeyapp/fido/dashboard.md
          - Passkeys: picokeyapp/fido/passkeys.md
          - Vault: picokeyapp/fido/vault.md
          - Vendor Features:
            - User PIN: picokeyapp/fido/user-pin.md
          - Slots:
            - Overview: picokeyapp/fido/slots.md
            - Challenge-response: picokeyapp/fido/slots/chalresp.md
            - Static password: picokeyapp/fido/slots/static-password.md
            - HOTP: picokeyapp/fido/slots/hotp.md
            - YubiOTP: picokeyapp/fido/slots/yubiotp.md
          - Accounts: picokeyapp/fido/accounts.md
          - Initialize: picokeyapp/fido/initialize.md
        - HSM:
          - Management:
            - Key management: picokeyapp/hsm/key-management.md
            - Cipher: picokeyapp/hsm/cipher.md
            - Hierarchical deterministic (HD): picokeyapp/hsm/hd.md
          - Initialization: picokeyapp/hsm/initialize.md
        - OpenPGP:
          - Management: picokeyapp/openpgp/management.md
          - PIV: picokeyapp/openpgp/piv.md
        - Audit: picokeyapp/audit.md
        - App settings: picokeyapp/app-settings.md
        - About: picokeyapp/about.md
        - License: picokeyapp/license.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
